variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: none
  DEBIAN_FRONTEND: noninteractive

default:
  tags: [testbed-ci-runner]
  before_script:
    - echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
    - export DEBIAN_FRONTEND=noninteractive
    - cd "$CI_PROJECT_DIR"
  cache: []

stages:
  - initialization
  - testbed_1
  - testbed_2

################################################################################
############################### INITIALIZATION #################################
################################################################################

workspace_preclean:
  stage: initialization
  interruptible: true
  resource_group: testbed
  variables:
    GIT_STRATEGY: none
  script:
    - sudo rm -rf * && sudo rm -rf .git*

clone_and_install_dependencies:
  stage: initialization
  interruptible: true
  resource_group: testbed
  needs: [workspace_preclean]
  dependencies: []
  script:
    - sudo apt-get update
    - sudo apt-get install -y sudo
    - sudo apt-get install -y bash
    - sudo apt-get install -y grep
    - sudo apt-get install -y coreutils
    - sudo apt-get install -y curl
    - sudo apt-get install -y wget
    - sudo apt-get install -y git
    - sudo apt-get install -y gnupg
    - sudo apt-get install -y lsb-release
    - sudo apt-get install -y --no-install-recommends tzdata
  artifacts:
    expire_in: 1 day
    when: always
  retry: 1
  
uninstall_all_components:
  stage: initialization
  interruptible: true
  resource_group: testbed
  needs: [clone_and_install_dependencies]
  variables:
    GIT_STRATEGY: none
  script:
    - "sed -i -E 's/^core_to_use:.*/core_to_use: open5gs/' 5G_Core_Network/options.yaml"
    - ./full_uninstall.sh
    - cd OpenAirInterface_Testbed
    - "sed -i -E 's/^core_to_use:.*/core_to_use: 5gdeploy-open5gs/' 5G_Core_Network/options.yaml"
    - ./full_uninstall.sh
  artifacts:
    expire_in: 1 day
    when: always
  retry: 1

################################################################################
########################### TESTBED 1 INSTALLATION #############################
################################################################################

install_open5gs:
  stage: testbed_1
  interruptible: true
  resource_group: testbed
  variables:
    GIT_STRATEGY: none
  script:
    - cd OpenAirInterface_Testbed/5G_Core_Network
    - "sed -i -E 's/^core_to_use:.*/core_to_use: open5gs/' options.yaml"
    # Disable systemctl so that Open5GS components are direct processes running in background
    - "sed -i -E 's/^use_systemctl:.*/use_systemctl: false/' options.yaml"
    - ./full_install.sh
  artifacts:
    expire_in: 1 day
    when: always
  retry: 0

install_oai_ue:
  stage: testbed_1
  interruptible: true
  resource_group: testbed
  needs: [install_open5gs]
  variables:
    GIT_STRATEGY: none
  script:
    - cd OpenAirInterface_Testbed/User_Equipment
    - ./full_install.sh
  artifacts:
    expire_in: 1 day
    when: always
  retry: 0

install_oai_gnb:
  stage: testbed_1
  interruptible: true
  resource_group: testbed
  needs: [install_oai_ue]
  variables:
    GIT_STRATEGY: none
  script:
    - cd OpenAirInterface_Testbed/Next_Generation_Node_B
    - ./full_install.sh
  artifacts:
    expire_in: 1 day
    when: always
  retry: 0

install_flexric:
  stage: testbed_1
  interruptible: true
  resource_group: testbed
