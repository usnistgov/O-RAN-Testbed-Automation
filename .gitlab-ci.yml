################################################################################
################################ FINALIZATION ##################################
################################################################################

post_install_cleanup:
  stage: finalization
  interruptible: true
  resource_group: testbed
  needs:
    - job: open5gs_srsran_oran_sc_ric_setup
      optional: true
    - job: openairinterface_flexric_5gdeploy_setup
      optional: true
  variables:
    GIT_STRATEGY: none
  allow_failure: true
  script:
    # Uninstall components then remove files from this run
    - |
      if [[ -f "5G_Core_Network/options.yaml" && -f "full_uninstall.sh" && -f "OpenAirInterface_Testbed/full_uninstall.sh" ]]; then
        # Testbed 1
        sed -i -E 's/^core_to_use:.*/core_to_use: open5gs/' 5G_Core_Network/options.yaml
        ./full_uninstall.sh
        # Testbed 2
        sed -i -E 's/^core_to_use:.*/core_to_use: 5gdeploy-open5gs/' 5G_Core_Network/options.yaml
        cd OpenAirInterface_Testbed
        ./full_uninstall.sh
        cd ..
        sed -i -E 's/^core_to_use:.*/core_to_use: open5gs/' 5G_Core_Network/options.yaml
      else
        echo "Repositories don't exist for uninstall_all_components, skipping."
      fi
    - sudo rm -rf * && sudo rm -rf .git*
  retry: 2
