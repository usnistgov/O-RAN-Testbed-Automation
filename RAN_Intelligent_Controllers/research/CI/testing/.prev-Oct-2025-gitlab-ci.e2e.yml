################################################################################
########################### TESTBED 1 INSTALLATION #############################
################################################################################

install_open5gs:
  stage: install_testbed_1
  interruptible: true
  resource_group: testbed
  needs: [clone_and_install_dependencies]
  script:
    - cd OpenAirInterface_Testbed/5G_Core_Network
    - "sed -i -E 's/^core_to_use:.*/core_to_use: open5gs/' options.yaml"
    - ./full_install.sh
    - cd ../..
  retry: 2

install_oai_ue_gnb:
  stage: install_testbed_1
  interruptible: true
  resource_group: testbed
  needs: [install_open5gs]
  script:
    - cd OpenAirInterface_Testbed/User_Equipment
    - ./full_install.sh
    - cd ../..
    - cd OpenAirInterface_Testbed/Next_Generation_Node_B
    - ./full_install.sh
    - cd ../..
  retry: 2

install_flexric:
  stage: install_testbed_1
  interruptible: true
  resource_group: testbed
  needs: [install_oai_ue_gnb]
  script:
    - cd OpenAirInterface_Testbed/RAN_Intelligent_Controllers/Flexible-RIC
    - ./full_install.sh
    - cd ../../..
  retry: 2

configure_oai_testbed:
  stage: install_testbed_1
  interruptible: true
  resource_group: testbed
  needs: [install_flexric]
  script:
    - cd OpenAirInterface_Testbed
    - ./generate_configurations.sh
    - cd ..
  retry: 2

