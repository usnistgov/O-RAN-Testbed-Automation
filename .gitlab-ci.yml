variables:
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: none
  DEBIAN_FRONTEND: noninteractive
  FF_USE_FASTZIP: true
  ARTIFACT_COMPRESSION_LEVEL: "slowest"
  CACHE_COMPRESSION_LEVEL: "slowest"

default:
  tags: [testbed-ci-runner]
  before_script:
    - echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
    - export DEBIAN_FRONTEND=noninteractive
    # - cd "$CI_PROJECT_DIR"
    - pwd
    - tree . -d

stages:
  - initialization
  - install_testbed_1
  - install_testbed_2
  - uninstall_testbed_1
  - uninstall_testbed_2

################################################################################
############################### INITIALIZATION #################################
################################################################################

uninstall_all_components:
  stage: initialization
  interruptible: true
  resource_group: testbed
  variables:
    GIT_STRATEGY: none
  script:
    - |
      if [[ -f "5G_Core_Network/options.yaml" && -f "full_uninstall.sh" && -f "OpenAirInterface_Testbed/full_uninstall.sh" ]]; then
        # Testbed 1
        sed -i -E 's/^core_to_use:.*/core_to_use: open5gs/' 5G_Core_Network/options.yaml
        ./full_uninstall.sh
        # Testbed 2
        sed -i -E 's/^core_to_use:.*/core_to_use: 5gdeploy-oai/' 5G_Core_Network/options.yaml
        cd OpenAirInterface_Testbed
        ./full_uninstall.sh
        cd ..
        sed -i -E 's/^core_to_use:.*/core_to_use: open5gs/' 5G_Core_Network/options.yaml
      else
        echo "Repositories don't exist yet for uninstall_all_components, skipping."
      fi
  artifacts:
    expire_in: 1 day
    when: always
  retry: 2

workspace_preclean:
  stage: initialization
  interruptible: true
  resource_group: testbed
  needs:        [uninstall_all_components]
  dependencies: [uninstall_all_components]
  variables:
    GIT_STRATEGY: none
  script:
    - sudo rm -rf * && sudo rm -rf .git*

clone_and_install_dependencies:
  stage: initialization
  interruptible: true
  resource_group: testbed
  needs:        [workspace_preclean]
  dependencies: [workspace_preclean]
  variables:
    GIT_STRATEGY: clone
  script:
    - sudo apt-get update
    - sudo apt-get install -y sudo bash grep coreutils curl wget git gnupg lsb-release tree
    - sudo apt-get install -y --no-install-recommends tzdata
  artifacts:
    expire_in: 1 day
    when: always
    paths:
      - ./
  retry: 2

################################################################################
########################### TESTBED 1 INSTALLATION #############################
################################################################################

install_open5gs:
  stage: install_testbed_1
  interruptible: true
  resource_group: testbed
  needs:        [clone_and_install_dependencies]
  dependencies: [clone_and_install_dependencies]
  variables:
    GIT_STRATEGY: none
  script:
    - cd OpenAirInterface_Testbed/5G_Core_Network
    - "sed -i -E 's/^core_to_use:.*/core_to_use: open5gs/' options.yaml"
    # Disable systemctl so that Open5GS components are direct processes running in background
    - "sed -i -E 's/^use_systemctl:.*/use_systemctl: false/' options.yaml"
    - ./full_install.sh
    - cd ../..
  artifacts:
    expire_in: 1 day
    when: always
    # paths:
    #   - ./
  retry: 2

install_oai_ue_gnb:
  stage: install_testbed_1
  interruptible: true
  resource_group: testbed
  needs:        [install_open5gs]
  dependencies: [install_open5gs]
  variables:
    GIT_STRATEGY: none
  script:
    - cd OpenAirInterface_Testbed/User_Equipment
    - ./full_install.sh
    - cd ../..
    - cd OpenAirInterface_Testbed/Next_Generation_Node_B
    - ./full_install.sh
    - cd ../..
  artifacts:
    expire_in: 1 day
    when: always
    # paths:
    #   - ./
  retry: 2

install_flexric:
  stage: install_testbed_1
  interruptible: true
  resource_group: testbed
  needs:        [install_open5gs, install_oai_ue_gnb]
  dependencies: [install_open5gs, install_oai_ue_gnb]
  variables:
    GIT_STRATEGY: none
  script:
    - cd OpenAirInterface_Testbed/RAN_Intelligent_Controllers/Flexible-RIC
    - ./full_install.sh
    - cd ../../..
  artifacts:
    expire_in: 1 day
    when: always
    # paths:
    #   - ./
  retry: 2

configure_oai_testbed:
  stage: install_testbed_1
  interruptible: true
  resource_group: testbed
  needs:        [install_open5gs, install_oai_ue_gnb, install_flexric]
  dependencies: [install_open5gs, install_oai_ue_gnb, install_flexric]
  variables:
    GIT_STRATEGY: none
  script:
    - cd OpenAirInterface_Testbed
    - ./generate_configurations.sh
    - cd ..
  artifacts:
    expire_in: 1 day
    when: always
    # paths:
    #   - ./
  retry: 2

############################ TODO: END-TO-END TESTS ############################


