variables:
  GIT_DEPTH: "1"
  GIT_STRATEGY: none #fetch
  GIT_SUBMODULE_STRATEGY: none
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "safe.directory"
  GIT_CONFIG_VALUE_0: "*"
  GIT_SSL_NO_VERIFY: "1"
  DEBIAN_FRONTEND: noninteractive
  FF_USE_FASTZIP: true
  ARTIFACT_COMPRESSION_LEVEL: "slowest"
  CACHE_COMPRESSION_LEVEL: "slowest"
  WORKSPACE_CACHE_KEY: "testbed-workspace:${CI_PIPELINE_ID}"


default:
  tags: [testbed-ci-runner]
  cache:
    key: "$WORKSPACE_CACHE_KEY"
    policy: pull-push
    when: always
    untracked: true
  # artifacts:
  #   paths:
  #     - ./
  #   expire_in: 1 day
  #   when: always
  before_script:
    - echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
    - export DEBIAN_FRONTEND=noninteractive
    - cd "$CI_PROJECT_DIR"
    - pwd
    - tree . -d
  after_script:
    - sudo chown --recursive "$USER" "$CI_PROJECT_DIR" || true

stages:
  - initialization
  - install_testbed_1
  - install_testbed_2
  - uninstall_testbed_1
  - uninstall_testbed_2

################################################################################
############################### INITIALIZATION #################################
################################################################################

uninstall_all_components:
  stage: initialization
  interruptible: true
  resource_group: testbed
  variables:
    GIT_STRATEGY: none
  allow_failure: true
  script:
    - |
      if [[ -f "5G_Core_Network/options.yaml" && -f "full_uninstall.sh" && -f "OpenAirInterface_Testbed/full_uninstall.sh" ]]; then
        # Testbed 1
        sed -i -E 's/^core_to_use:.*/core_to_use: open5gs/' 5G_Core_Network/options.yaml
        ./full_uninstall.sh
        # Testbed 2
        sed -i -E 's/^core_to_use:.*/core_to_use: 5gdeploy-oai/' 5G_Core_Network/options.yaml
        cd OpenAirInterface_Testbed
        ./full_uninstall.sh
        cd ..
        sed -i -E 's/^core_to_use:.*/core_to_use: open5gs/' 5G_Core_Network/options.yaml
      else
        echo "Repositories don't exist yet for uninstall_all_components, skipping."
      fi
  retry: 2

workspace_preclean:
  stage: initialization
  interruptible: true
  resource_group: testbed
  needs: [uninstall_all_components]
  variables:
    GIT_STRATEGY: none
  script:
    - sudo rm -rf * && sudo rm -rf .git*
  cache:
    key: "$WORKSPACE_CACHE_KEY"
    policy: pull
    when: always
    untracked: true

clone_and_install_dependencies:
  stage: initialization
  interruptible: true
  resource_group: testbed
  needs: [workspace_preclean]
  variables:
    GIT_STRATEGY: clone
  script:

    - sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock || true
    - sudo dpkg --configure -a || true
    - |
      if dpkg -s mongosh >/dev/null 2>&1 || ls /var/lib/dpkg/info/mongosh* >/dev/null 2>&1; then
        echo "Purging broken mongosh package..."
        sudo dpkg --remove --force-remove-reinstreq mongosh || true
        sudo dpkg --purge mongosh || true
        sudo rm -f /var/lib/dpkg/info/mongosh.* || true
      fi
    - sudo apt-get -y -f install || true
    - sudo apt-get update
    - sudo apt-get install -y sudo bash grep coreutils curl wget git gnupg lsb-release tree
    - sudo apt-get install -y --no-install-recommends tzdata
    - sudo update-ca-certificates || true
  cache:
    key: "$WORKSPACE_CACHE_KEY"
    policy: push
    when: always
    untracked: true
  retry: 2

