  interruptible: true
  resource_group: testbed
  needs: [install_flexric]
  variables:
    GIT_STRATEGY: none
  script:
    - cd OpenAirInterface_Testbed
    - ./generate_configurations.sh
  artifacts:
    expire_in: 1 day
    when: always
  retry: 0

uninstall_oai_ue:
  stage: testbed_1
  interruptible: true
  resource_group: testbed
  needs: [configure_oai_testbed]
  variables:
    GIT_STRATEGY: none
  script:
    - cd OpenAirInterface_Testbed/User_Equipment
    - ./full_uninstall.sh
  artifacts:
    expire_in: 1 day
    when: always
  retry: 0

uninstall_oai_gnb:
  stage: testbed_1
  interruptible: true
  resource_group: testbed
  needs: [uninstall_oai_ue]
  variables:
    GIT_STRATEGY: none
  script:
    - cd OpenAirInterface_Testbed/Next_Generation_Node_B
    - ./full_uninstall.sh
  artifacts:
    expire_in: 1 day
    when: always
  retry: 0

uninstall_flexric:
  stage: testbed_1
