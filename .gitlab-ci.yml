stages:
  - install_openairinterface_testbed
  - install_srsran_oransc_testbed

install_openairinterface_testbed:
  stage: install_openairinterface_testbed
  image: ubuntu:22.04
  resource_group: testbed_install
  interruptible: true
  before_script:
    - apt-get update
    - apt-get install -y sudo bash grep coreutils curl wget git gnupg
  script:
    - set -e
    - echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
    - DEBIAN_FRONTEND=noninteractive sudo apt-get update && sudo apt-get -y --no-install-recommends install tzdata
    - echo -e '#!/bin/sh\necho "systemctl not supported in CI container"\nexit 0' | sudo tee /usr/local/bin/systemctl > /dev/null
    - sudo chmod +x /usr/local/bin/systemctl
    - cd OpenAirInterface_Testbed
    - "sed -i -E 's/^core_to_use:.*/core_to_use: 5gdeploy-open5gs/' 5G_Core_Network/options.yaml"
    - bash ./full_install.sh
    - bash ./generate_configurations.sh
    # - |
    #   echo "Starting run.sh and waiting up to 2 minutes for DRB.PdcpSduVolumeDL..."
    #   if timeout 120s bash ./run.sh |& grep -q "DRB.PdcpSduVolumeDL"; then
    #     echo "Successfully found DRB.PdcpSduVolumeDL in FlexRIC output."
    #   else
    #     echo "String DRB.PdcpSduVolumeDL not found in output after 2 minutes."
    #     exit 1
    #   fi
    # - bash ./full_uninstall.sh
  artifacts:
    expire_in: 1 day
    when: always
  retry: 0

